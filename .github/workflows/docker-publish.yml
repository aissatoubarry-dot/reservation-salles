name: Publish Docker image for Git tags

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific tag to publish, or all"
        required: false
        default: "all"
  schedule:
    - cron: "0 3 * * *"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Docker build files exist
        shell: bash
        run: |
          set -e

          if [ ! -f Dockerfile ]; then
            cat > Dockerfile <<'EOF'
          FROM php:8.3-fpm-alpine

          RUN docker-php-ext-install pdo pdo_mysql

          COPY --from=composer:2 /usr/bin/composer /usr/bin/composer

          WORKDIR /var/www/html

          COPY composer.json ./

          RUN composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader --no-scripts

          COPY . .

          EXPOSE 9000

          CMD ["php-fpm"]
          EOF
          fi

          if [ ! -f docker-compose.yml ] && [ ! -f docker-compose.yaml ]; then
            cat > docker-compose.yml <<'EOF'
          services:
            app:
              build:
                context: .
                dockerfile: Dockerfile
              image: ${DOCKERHUB_USERNAME:-local}/reservation-salles:${GITHUB_REF_NAME}
              ports:
                - "8080:80"
          EOF
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push selected tags
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            tags="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            input_tag="${{ github.event.inputs.tag }}"
            if [[ -n "$input_tag" && "$input_tag" != "all" ]]; then
              tags="$input_tag"
            else
              tags=$(git tag --sort=-creatordate)
            fi
          else
            tags=$(git tag --sort=-creatordate)
          fi

          echo "Tags to publish:"
          printf '%s\n' "$tags"

          for tag in $tags; do
            if [[ -z "$tag" ]]; then
              continue
            fi

            docker_tag="${tag//\//-}"
            echo "Publishing $tag as $docker_tag"
            docker build -t "${DOCKERHUB_USERNAME}/reservation-salles:${docker_tag}" .
            docker push "${DOCKERHUB_USERNAME}/reservation-salles:${docker_tag}"
          done
