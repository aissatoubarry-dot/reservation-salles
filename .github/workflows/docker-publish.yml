name: Publish Docker image for Git tags

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Docker build files exist
        shell: bash
        run: |
          set -e

          if [ ! -f Dockerfile ]; then
            cat > Dockerfile <<'EOF'
          FROM php:8.3-fpm-alpine

          RUN docker-php-ext-install pdo pdo_mysql

          COPY --from=composer:2 /usr/bin/composer /usr/bin/composer

          WORKDIR /var/www/html

          COPY composer.json ./

          RUN composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader --no-scripts

          COPY . .

          EXPOSE 9000

          CMD ["php-fpm"]
          EOF
          fi

          if [ ! -f docker-compose.yml ] && [ ! -f docker-compose.yaml ]; then
            cat > docker-compose.yml <<'EOF'
          services:
            app:
              build:
                context: .
                dockerfile: Dockerfile
              image: ${DOCKERHUB_USERNAME:-local}/reservation-salles:${GITHUB_REF_NAME}
              ports:
                - "8080:80"
          EOF
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker tag
        shell: bash
        run: |
          echo "DOCKER_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Build and push tagged image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/reservation-salles:${{ env.DOCKER_TAG }}
